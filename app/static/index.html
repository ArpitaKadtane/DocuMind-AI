<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenAI Document Assistant</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --accent: #4f46e5;
      --accent-dark: #4338ca;
      --text: #1f2937;
      --muted: #6b7280;
      --ok: #047857;
      --warn: #b45309;
      --err: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .container { width: 100%; max-width: 760px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 20px; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type="file"] { margin-bottom: 12px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    button + button { margin-left: 8px; }
    button.secondary { background: #e5e7eb; color: var(--text); }
    button.secondary:hover { background: #d1d5db; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { margin-top: 12px; font-size: .92rem; }
    .status.error { color: var(--err); }
    .status.ok { color: var(--ok); }
    .answer {
      margin-top: 12px;
      padding: 14px;
      border-radius: 8px;
      background: #f9fafb;
      border-left: 4px solid var(--accent);
      white-space: pre-wrap;
    }
    .answer.notfound { border-left-color: var(--warn); }
    .badge {
      display: inline-block;
      font-size: .75rem;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .badge.found { background: #d1fae5; color: var(--ok); }
    .badge.notfound { background: #fef3c7; color: var(--warn); }
    details { margin-top: 10px; }
    summary { cursor: pointer; color: var(--muted); }
    .source {
      font-size: .85rem;
      color: var(--muted);
      border-top: 1px solid #eee;
      padding: 8px 0;
      white-space: pre-wrap;
    }
    .keypoints { margin: 8px 0 0; padding-left: 20px; }
    .keypoints li { margin-bottom: 4px; }
    .quiz-row { display: flex; gap: 8px; align-items: center; }
    .quiz-row input[type="number"] {
      width: 90px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }
    .quiz-progress { color: var(--muted); font-size: .9rem; margin: 12px 0 6px; }
    .quiz-question { font-weight: 600; margin-bottom: 10px; }
    .quiz-option {
      display: block;
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .quiz-option:hover { background: #f9fafb; }
    .quiz-option input { margin-right: 8px; }
    .quiz-nav { margin-top: 8px; }
    .quiz-review-item { border-top: 1px solid #eee; padding: 10px 0; }
    .quiz-review-q { font-weight: 600; margin-bottom: 6px; }
    .quiz-review-option { padding: 2px 0; color: var(--muted); }
    .quiz-review-option.correct { color: var(--ok); font-weight: 600; }
    .quiz-review-option.wrong { color: var(--err); }
    .quiz-review-note { margin-top: 6px; font-size: .85rem; color: var(--muted); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GenAI Document Assistant</h1>
    <p class="subtitle">Upload a PDF, then ask questions grounded in its contents.</p>

    <div class="card" id="authCard">
      <label for="email">Sign in</label>
      <input type="text" id="email" placeholder="you@example.com" autocomplete="username" />
      <input type="password" id="password" placeholder="Password (min 8 characters)" autocomplete="current-password" />
      <button id="loginBtn">Log in</button>
      <button id="registerBtn" class="secondary">Create account</button>
      <div id="authStatus" class="status"></div>
    </div>

    <div class="card hidden" id="uploadCard">
      <label for="file">1. Upload a PDF</label>
      <input type="file" id="file" accept="application/pdf" />
      <button id="uploadBtn">Upload</button>
      <div id="uploadStatus" class="status"></div>
      <div id="docInfo" class="status ok hidden"></div>
    </div>

    <div class="card hidden" id="askCard">
      <label for="question">2. Ask a question</label>
      <input type="text" id="question" placeholder="e.g. What is the budget?" />
      <button id="askBtn">Ask</button>
      <button id="summarizeBtn" class="secondary">Summarize document</button>
      <div id="askStatus" class="status"></div>
      <div id="answerBox" class="hidden">
        <span id="answerBadge" class="badge"></span>
        <div id="answer" class="answer"></div>
        <details id="sourcesBox" class="hidden">
          <summary>Show sources</summary>
          <div id="sources"></div>
        </details>
      </div>
      <div id="summaryBox" class="hidden">
        <span id="summaryBadge" class="badge found"></span>
        <div id="summaryText" class="answer"></div>
        <ul id="keyPoints" class="keypoints"></ul>
        <details id="summarySourcesBox" class="hidden">
          <summary>Show sources</summary>
          <div id="summarySources"></div>
        </details>
      </div>
    </div>

    <div class="card hidden" id="quizCard">
      <label for="quizCount">3. Generate a quiz</label>
      <div class="quiz-row">
        <input type="number" id="quizCount" min="1" max="15" value="5" />
        <button id="quizBtn">Generate quiz</button>
      </div>
      <div id="quizStatus" class="status"></div>
      <div id="quizBox" class="hidden">
        <div id="quizProgress" class="quiz-progress"></div>
        <div id="quizQuestion" class="quiz-question"></div>
        <div id="quizOptions"></div>
        <div class="quiz-nav">
          <button id="quizPrev" class="secondary">Previous</button>
          <button id="quizNext" class="secondary">Next</button>
          <button id="quizSubmit">Submit answers</button>
        </div>
      </div>
      <div id="quizResultBox" class="hidden">
        <div id="quizScore" class="answer"></div>
        <div id="quizReview"></div>
      </div>
    </div>
  </div>

  <script>
    const API = "";
    let documentId = null;
    let token = null;
    let quiz = null;
    let quizIndex = 0;
    let quizSelections = [];

    const $ = (id) => document.getElementById(id);

    function setStatus(el, message, type) {
      el.textContent = message;
      el.className = "status" + (type ? " " + type : "");
    }

    function authHeaders(extra) {
      const headers = Object.assign({}, extra || {});
      if (token) headers["Authorization"] = "Bearer " + token;
      return headers;
    }

    function showApp() {
      $("authCard").classList.add("hidden");
      $("uploadCard").classList.remove("hidden");
    }

    function requireLogin(message) {
      token = null;
      documentId = null;
      quiz = null;
      quizSelections = [];
      $("authCard").classList.remove("hidden");
      $("uploadCard").classList.add("hidden");
      $("askCard").classList.add("hidden");
      $("quizCard").classList.add("hidden");
      setStatus($("authStatus"), message || "Please sign in.", "error");
    }

    async function authenticate(path, email, password) {
      const res = await fetch(API + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Authentication failed.");
      return data;
    }

    $("loginBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) {
        setStatus($("authStatus"), "Enter your email and password.", "error");
        return;
      }
      try {
        const data = await authenticate("/auth/login", email, password);
        token = data.access_token;
        setStatus($("authStatus"), "", "");
        showApp();
      } catch (err) {
        setStatus($("authStatus"), err.message, "error");
      }
    });

    $("registerBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) {
        setStatus($("authStatus"), "Enter an email and a password (min 8 characters).", "error");
        return;
      }
      try {
        await authenticate("/auth/register", email, password);
        const data = await authenticate("/auth/login", email, password);
        token = data.access_token;
        setStatus($("authStatus"), "", "");
        showApp();
      } catch (err) {
        setStatus($("authStatus"), err.message, "error");
      }
    });

    $("uploadBtn").addEventListener("click", async () => {
      const fileInput = $("file");
      const statusEl = $("uploadStatus");
      $("docInfo").classList.add("hidden");

      if (!fileInput.files.length) {
        setStatus(statusEl, "Please choose a PDF file first.", "error");
        return;
      }
      const file = fileInput.files[0];
      const form = new FormData();
      form.append("file", file);

      $("uploadBtn").disabled = true;
      setStatus(statusEl, "Uploading and processing…", "");

      try {
        const res = await fetch(API + "/documents", {
          method: "POST",
          headers: authHeaders(),
          body: form,
        });
        const data = await res.json();
        if (res.status === 401) {
          requireLogin("Your session expired. Please sign in again.");
          return;
        }
        if (!res.ok) {
          setStatus(statusEl, data.detail || "Upload failed.", "error");
          return;
        }
        documentId = data.document_id;
        setStatus(statusEl, "Upload successful.", "ok");
        const info = $("docInfo");
        info.textContent = `📄 ${data.filename} — ${data.pages} page(s), ${data.chunks} chunk(s), ${data.characters} characters`;
        info.classList.remove("hidden");
        $("askCard").classList.remove("hidden");
        $("quizCard").classList.remove("hidden");
      } catch (err) {
        setStatus(statusEl, "Network error while uploading.", "error");
      } finally {
        $("uploadBtn").disabled = false;
      }
    });

    function renderSources(sourcesEl, boxEl, sources) {
      sourcesEl.innerHTML = "";
      if (!sources || !sources.length) {
        boxEl.classList.add("hidden");
        return;
      }
      sources.forEach((s, i) => {
        const div = document.createElement("div");
        div.className = "source";
        if (s && typeof s === "object") {
          const pageLabel =
            s.page === null || s.page === undefined
              ? "page unavailable"
              : `page ${s.page}`;
          const name = s.filename ? `${s.filename} — ` : "";
          div.textContent = `[${i + 1}] ${name}${pageLabel}: ${s.text}`;
        } else {
          div.textContent = `[${i + 1}] ${s}`;
        }
        sourcesEl.appendChild(div);
      });
      boxEl.classList.remove("hidden");
    }

    $("askBtn").addEventListener("click", async () => {
      const question = $("question").value.trim();
      const statusEl = $("askStatus");
      $("answerBox").classList.add("hidden");
      $("sourcesBox").classList.add("hidden");

      if (!documentId) {
        setStatus(statusEl, "Upload a document first.", "error");
        return;
      }
      if (!question) {
        setStatus(statusEl, "Please type a question.", "error");
        return;
      }

      $("askBtn").disabled = true;
      setStatus(statusEl, "Thinking…", "");

      try {
        const res = await fetch(API + `/documents/${documentId}/ask`, {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        if (res.status === 401) {
          requireLogin("Your session expired. Please sign in again.");
          return;
        }
        if (!res.ok) {
          setStatus(statusEl, data.detail || "Request failed.", "error");
          return;
        }
        setStatus(statusEl, "", "");

        const badge = $("answerBadge");
        badge.textContent = data.found ? "Answer found in document" : "Not found";
        badge.className = "badge " + (data.found ? "found" : "notfound");

        const answerEl = $("answer");
        answerEl.textContent = data.answer;
        answerEl.className = "answer" + (data.found ? "" : " notfound");

        renderSources($("sources"), $("sourcesBox"), data.sources);
        $("answerBox").classList.remove("hidden");
      } catch (err) {
        setStatus(statusEl, "Network error while asking.", "error");
      } finally {
        $("askBtn").disabled = false;
      }
    });

    $("summarizeBtn").addEventListener("click", async () => {
      const statusEl = $("askStatus");
      $("summaryBox").classList.add("hidden");

      if (!documentId) {
        setStatus(statusEl, "Upload a document first.", "error");
        return;
      }

      $("summarizeBtn").disabled = true;
      setStatus(statusEl, "Summarizing…", "");

      try {
        const res = await fetch(API + `/documents/${documentId}/summary`, {
          method: "POST",
          headers: authHeaders(),
        });
        const data = await res.json();
        if (res.status === 401) {
          requireLogin("Your session expired. Please sign in again.");
          return;
        }
        if (!res.ok) {
          setStatus(statusEl, data.detail || "Summarization failed.", "error");
          return;
        }
        setStatus(statusEl, "", "");

        const badge = $("summaryBadge");
        badge.textContent = data.found ? "Summary" : "No content to summarize";
        badge.className = "badge " + (data.found ? "found" : "notfound");

        $("summaryText").textContent = data.summary || "";

        const list = $("keyPoints");
        list.innerHTML = "";
        (data.key_points || []).forEach((point) => {
          const li = document.createElement("li");
          li.textContent = point;
          list.appendChild(li);
        });

        renderSources($("summarySources"), $("summarySourcesBox"), data.sources);
        $("summaryBox").classList.remove("hidden");
      } catch (err) {
        setStatus(statusEl, "Network error while summarizing.", "error");
      } finally {
        $("summarizeBtn").disabled = false;
      }
    });

    function renderQuizQuestion() {
      const question = quiz.questions[quizIndex];
      $("quizProgress").textContent =
        "Question " + (quizIndex + 1) + " of " + quiz.questions.length;

      $("quizQuestion").textContent = question.question;

      const optionsEl = $("quizOptions");
      optionsEl.innerHTML = "";
      question.options.forEach((option, i) => {
        const label = document.createElement("label");
        label.className = "quiz-option";
        const input = document.createElement("input");
        input.type = "radio";
        input.name = "quizOption";
        input.value = String(i);
        input.checked = quizSelections[quizIndex] === i;
        input.addEventListener("change", () => {
          quizSelections[quizIndex] = i;
        });
        const span = document.createElement("span");
        span.textContent = option;
        label.appendChild(input);
        label.appendChild(span);
        optionsEl.appendChild(label);
      });

      $("quizPrev").disabled = quizIndex === 0;
      $("quizNext").disabled = quizIndex === quiz.questions.length - 1;
    }

    function renderQuizResult(data) {
      const score = data.score || {};
      $("quizScore").textContent =
        "You scored " + score.correct + " out of " + score.total +
        " (" + score.percent + "%).";

      const review = $("quizReview");
      review.innerHTML = "";
      (data.results || []).forEach((result) => {
        const item = document.createElement("div");
        item.className = "quiz-review-item";

        const head = document.createElement("div");
        head.className = "quiz-review-q";
        head.textContent = (result.index + 1) + ". " + result.question;
        item.appendChild(head);

        result.options.forEach((option, i) => {
          const line = document.createElement("div");
          line.className = "quiz-review-option";
          let suffix = "";
          if (i === result.correct_index) {
            line.classList.add("correct");
            suffix = "  (correct answer)";
          } else if (i === result.selected_index) {
            line.classList.add("wrong");
            suffix = "  (your answer)";
          }
          line.textContent = option + suffix;
          item.appendChild(line);
        });

        const note = document.createElement("div");
        note.className = "quiz-review-note";
        const pageLabel =
          result.page === null || result.page === undefined
            ? "page unavailable"
            : "page " + result.page;
        note.textContent =
          (result.explanation ? result.explanation + " " : "") +
          "(source: " + pageLabel + ")";
        item.appendChild(note);

        review.appendChild(item);
      });
    }

    $("quizBtn").addEventListener("click", async () => {
      const statusEl = $("quizStatus");
      $("quizBox").classList.add("hidden");
      $("quizResultBox").classList.add("hidden");

      if (!documentId) {
        setStatus(statusEl, "Upload a document first.", "error");
        return;
      }
      const count = parseInt($("quizCount").value, 10);
      if (!count || count < 1 || count > 15) {
        setStatus(statusEl, "Choose between 1 and 15 questions.", "error");
        return;
      }

      $("quizBtn").disabled = true;
      setStatus(statusEl, "Generating quiz…", "");

      try {
        const res = await fetch(API + `/documents/${documentId}/quiz`, {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ count }),
        });
        const data = await res.json();
        if (res.status === 401) {
          requireLogin("Your session expired. Please sign in again.");
          return;
        }
        if (!res.ok) {
          setStatus(statusEl, data.detail || "Could not generate a quiz.", "error");
          return;
        }
        if (!data.questions || !data.questions.length) {
          setStatus(statusEl, "No questions were generated.", "error");
          return;
        }

        quiz = data;
        quizIndex = 0;
        quizSelections = new Array(data.questions.length).fill(null);
        setStatus(
          statusEl,
          data.truncated
            ? "Quiz generated from a sample of this large document."
            : "Quiz generated.",
          "ok"
        );
        renderQuizQuestion();
        $("quizBox").classList.remove("hidden");
      } catch (err) {
        setStatus(statusEl, "Network error while generating the quiz.", "error");
      } finally {
        $("quizBtn").disabled = false;
      }
    });

    $("quizPrev").addEventListener("click", () => {
      if (quiz && quizIndex > 0) {
        quizIndex -= 1;
        renderQuizQuestion();
      }
    });

    $("quizNext").addEventListener("click", () => {
      if (quiz && quizIndex < quiz.questions.length - 1) {
        quizIndex += 1;
        renderQuizQuestion();
      }
    });

    $("quizSubmit").addEventListener("click", async () => {
      if (!quiz) return;
      const statusEl = $("quizStatus");
      $("quizSubmit").disabled = true;
      setStatus(statusEl, "Scoring…", "");

      try {
        const res = await fetch(
          API + `/documents/${documentId}/quiz/${quiz.quiz_id}/submit`,
          {
            method: "POST",
            headers: authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ answers: quizSelections }),
          }
        );
        const data = await res.json();
        if (res.status === 401) {
          requireLogin("Your session expired. Please sign in again.");
          return;
        }
        if (!res.ok) {
          setStatus(statusEl, data.detail || "Could not score the quiz.", "error");
          return;
        }
        setStatus(statusEl, "", "");
        $("quizBox").classList.add("hidden");
        renderQuizResult(data);
        $("quizResultBox").classList.remove("hidden");
      } catch (err) {
        setStatus(statusEl, "Network error while scoring the quiz.", "error");
      } finally {
        $("quizSubmit").disabled = false;
      }
    });

    $("question").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("askBtn").click();
    });
  </script>
</body>
</html>
